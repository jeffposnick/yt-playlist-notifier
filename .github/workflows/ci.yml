name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  checks: write
  contents: read
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test-and-deploy:
    name: Lint, build, test, and deploy
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      # PRs only test Chromium, so skip downloading the other browsers and their OS dependencies.
      PLAYWRIGHT_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          VITE_YT_API_KEY: ${{ secrets.VITE_YT_API_KEY }}
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npx playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}-${{ env.PLAYWRIGHT_BROWSERS }}
      - name: Install browsers and system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          read -ra browsers <<< "$PLAYWRIGHT_BROWSERS"
          npx playwright install --with-deps "${browsers[@]}"
      - name: Install OS dependencies for browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          read -ra browsers <<< "$PLAYWRIGHT_BROWSERS"
          npx playwright install-deps "${browsers[@]}"
      - name: Run Playwright tests
        run: |
          read -ra browsers <<< "$PLAYWRIGHT_BROWSERS"
          npm run test -- "${browsers[@]/#/--project=}"
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Deploy to Firebase Hosting live channel
        if: ${{ github.event_name == 'push' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YT_PLAYLIST_NOTIFIER }}
          channelId: live
          projectId: yt-playlist-notifier
      - name: Deploy to Firebase Hosting preview channel
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_YT_PLAYLIST_NOTIFIER }}
          projectId: yt-playlist-notifier
